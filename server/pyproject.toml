[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "odoo-agent-mcp"
version = "1.0.0"
description = "Security-first Model Context Protocol server for Odoo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Odoo MCP Contributors" }]
dependencies = [
    "mcp[cli]==1.28.1",
    "httpx>=0.28.1,<0.29",
    "PyJWT[crypto]>=2.10.1,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "respx>=0.22,<0.23",
    "ruff>=0.12,<1",
]

[project.scripts]
odoo-agent-mcp = "odoo_agent_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_agent_mcp"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["odoo_agent_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "S"]
ignore = [
    "S101", # Assertions are expected in tests.
    "S311", # Retry jitter is not a security token or cryptographic value.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106"]
