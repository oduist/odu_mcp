name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        working-directory: server
        run: uv sync --frozen --extra test
      - name: Lint
        working-directory: server
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        working-directory: server
        run: uv run pytest --cov=odoo_agent_mcp --cov-report=term-missing --cov-fail-under=65

  odoo-addon:
    name: Odoo 19 addon
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and test addon
        run: >-
          docker run --rm
          --network host
          -v "${{ github.workspace }}/addons:/mnt/extra-addons:ro"
          odoo:19.0
          --db_host=127.0.0.1
          --db_port=5432
          --db_user=odoo
          --db_password=odoo
          -d odu_mcp_ci
          -i odoo_mcp_control
          --test-enable
          --test-tags=/odoo_mcp_control
          --stop-after-init
          --log-level=test
