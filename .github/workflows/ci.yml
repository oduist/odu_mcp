name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Connect MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        working-directory: addons/connect_mcp/deploy/connect_mcp_server
        run: uv sync --frozen --extra test
      - name: Lint
        working-directory: addons/connect_mcp/deploy/connect_mcp_server
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        working-directory: addons/connect_mcp/deploy/connect_mcp_server
        run: uv run pytest --cov=connect_mcp_server --cov-report=term-missing --cov-fail-under=95

  odoo-addon:
    name: Odoo 19 addon
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Install and test addon
        run: >-
          docker run --rm
          --network host
          -e HOST=127.0.0.1
          -e PORT=5432
          -e USER=odoo
          -e PASSWORD=odoo
          -v "${{ github.workspace }}/addons:/mnt/extra-addons:ro"
          odoo:19.0
          -d connect_addons_ng_ci
          -i connect_mcp
          --test-enable
          --test-tags=/connect_mcp
          --stop-after-init
          --log-level=test
